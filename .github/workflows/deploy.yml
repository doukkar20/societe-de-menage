# .github/workflows/deploy.yml
name: Deploy EclatNet Website

on:
  push:
    branches:
      - main
      - master  # Trigger on pushes to main or master branches

permissions:
  contents: write  # Required for JamesIves/github-pages-deploy-action to write to the gh-pages branch

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Build Static Assets
        # This compiles the Vite frontend into `/dist`
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # The folder where the build output is placed
          branch: gh-pages # The branch the action will deploy to
          clean: true # Automatically remove obsolete files
